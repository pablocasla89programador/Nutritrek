<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<style>
:root{--bg:#edf2f3;--card:#fff;--tx:#12262d;--mu:#5d727a;--ac:#1f6f8b;--on:#fff;--bd:#d3dfe2;--in:#f5f9fa;--m0:#d98a2b;--m1:#2a86a8;--m2:#8a3f72;--m3:#3d4f9a;--dg:#b3382c}
:root[data-t=dark]{--bg:#0e1b24;--card:#16262f;--tx:#e6eff2;--mu:#8ea6af;--ac:#6cc3dc;--on:#0e1b24;--bd:#26404d;--in:#112029;--m0:#f0a94f;--m1:#6cc3dc;--m2:#d78ac0;--m3:#8e9de0;--dg:#ff8a7a}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
#app{padding:calc(14px + env(safe-area-inset-top)) 16px 160px;max-width:640px;margin:auto}
.bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.bar h1{flex:1;font-size:27px;font-weight:800;letter-spacing:-.02em}
h2{font-size:18px;margin:18px 0 4px}h3{font-size:19px;margin-bottom:6px}
.card{background:var(--card);border:1px solid var(--bd);border-left:5px solid var(--k,var(--bd));border-radius:8px;padding:11px 13px;margin:7px 0;display:flex;flex-direction:column;gap:3px}
.mu{color:var(--mu);font-size:13px}.c{text-align:center;margin:36px 0}
.mx{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--mu);font-size:13px}
.tag{font-style:normal;font-size:12px;border:1px solid var(--bd);border-radius:20px;padding:0 8px;color:var(--mu)}
label{display:block;font-size:13px;color:var(--mu);margin-top:9px}
input,select{width:100%;font:inherit;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-top:3px}
button{font:inherit;border-radius:10px;padding:10px 14px;background:var(--in);color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.b{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:700}.g{background:none;border-color:transparent}.dg{color:var(--dg)}
.fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));box-shadow:0 4px 14px #0005;border-radius:26px;padding:13px 20px}
.r2,.r4{display:grid;gap:8px}.r2{grid-template-columns:1fr 1fr}.r4{grid-template-columns:repeat(4,1fr)}
.row{display:grid;grid-template-columns:1fr 78px 42px;gap:6px;margin-top:6px}.row *{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}.ch{display:flex;gap:6px;align-items:center;border:1px solid var(--bd);border-radius:20px;padding:6px 12px;margin:0;color:var(--tx)}.ch input{width:auto;margin:0}
.bar2{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin:3px 0 6px}.bar2 i{display:block;height:100%;background:var(--ac)}
#nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
#nav button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--mu);padding:4px 0}
#nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav .on{color:var(--ac);font-weight:700}
#nav .mid svg{background:var(--ac);color:var(--on);border-radius:50%;width:52px;height:52px;padding:13px;margin-top:-26px;border:4px solid var(--bg)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:9}.hid{display:none}
.sh{background:var(--card);width:100%;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px}
.sh label{margin-top:4px}
.ph{width:100%;text-align:left;border-color:var(--bd);margin-top:6px}
#t{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:20px;z-index:10;font-size:13px;max-width:90%;text-align:center}
</style></head><body>
<div id="app"></div><nav id="nav"></nav>
<div id="ov" class="ov hid"><div class="sh" id="sh"></div></div><div id="t" hidden></div>
<script src="/__/firebase/8.10.1/firebase-app.js"></script>
<script src="/__/firebase/8.10.1/firebase-auth.js"></script>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)],uid=()=>Math.random().toString(36).slice(2,9),
esc=s=>String(s??'').replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),num=v=>parseFloat(v)||0,
MEALS=['Desayuno','Almuerzo','Merienda','Cena'],CATS=['Entrada','Plato principal','Postre','Picar','Bebida','Infusión'],
KINDS=['Suelto (se mezcla)','Paquete para cocinar','Liofilizado','Deshidratado','Paquete listo para consumo','Lata lista para consumo','Listo para consumo'],RDY=k=>/consumo/.test(k),
norm=()=>{S.projects.forEach(p=>p.trip=p.trip||[]);S.pantry.forEach(f=>{f.kind=f.kind=='listo'?'Listo para consumo':KINDS.includes(f.kind)?f.kind:KINDS[0]})};
let S=JSON.parse(localStorage.getItem('nia')||'null')||{pantry:[],projects:[],profile:{},set:{theme:'auto',key:'',model:'gemini-3.8-flash'}},
tab='menus',pid=null,showA=false,cur={},ia={},user=null,db=null,tm,syncing=0,trip=false,PH=[null,null,null],PX=[false,false,false],lastCall=0,hd=0,skip=0,ht;
const store=()=>localStorage.setItem('nia',JSON.stringify(S)),
save=()=>{S.u=Date.now();S.d=1;store();clearTimeout(tm);tm=setTimeout(sync,1500)},
P=()=>S.projects.find(p=>p.id==pid),
toast=m=>{const t=$('#t');t.textContent=m;t.hidden=false;clearTimeout(toast.i);toast.i=setTimeout(()=>t.hidden=true,3500)},
show=h=>{$('#sh').innerHTML=h;$('#ov').classList.remove('hid');navSync()},
st=m=>{const e=$('#st');e?e.textContent=m:toast(m)},
opt=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join(''),
fld=(l,id,v,t='text')=>`<label>${l}<input id="${id}" type="${t}" value="${esc(v)}"${t=='number'?' inputmode="decimal" step="any"':''}></label>`,
fs=(l,k,t='text')=>{const[o,n]=k.split('.');return`<label>${l}<input data-s="${k}" type="${t}" value="${esc(S[o][n])}"${t=='number'?' inputmode="decimal"':''}></label>`},
nm=id=>S.pantry.find(x=>x.id==id)?.name||'(eliminado)',
mac=m=>(m.items||[]).reduce((a,i)=>{const f=S.pantry.find(x=>x.id==i.id);if(f){const k=i.g/100;a[0]+=f.kcal*k;a[1]+=f.prot*k;a[2]+=f.carb*k;a[3]+=f.fat*k}return a},[0,0,0,0]),
fm=a=>`<span>${Math.round(a[0])} kcal</span><span>P ${Math.round(a[1])}</span><span>C ${Math.round(a[2])}</span><span>G ${Math.round(a[3])}</span>`,
age=()=>S.profile.birth?Math.floor((Date.now()-new Date(S.profile.birth))/31557600000):0,
need=()=>{const p=S.profile,a=age();if(!(p.weight&&p.height&&a&&p.sex))return null;const b=10*p.weight+6.25*p.height-5*a+(p.sex=='M'?5:-161);return[b,b*1.6,b*2].map(v=>Math.round(v))},
theme=()=>{const t=S.set.theme;document.documentElement.dataset.t=t=='auto'?(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'):t;$('#tc').content=getComputedStyle(document.documentElement).getPropertyValue('--ac').trim()},
img=f=>new Promise((ok,no)=>{const i=new Image();i.onerror=()=>no(Error('No pude leer la imagen'));i.onload=()=>{const k=Math.min(1,1024/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.8).split(',')[1])};i.src=URL.createObjectURL(f)});
async function gem0(parts,schema){
 if(!S.set.key)throw Error('Cargá tu API key de Gemini en Ajustes');
 if(!navigator.onLine)throw Error('Sin conexión: la IA necesita internet');
 const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${S.set.model}:generateContent?key=${S.set.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts}],generationConfig:{responseMimeType:'application/json',...(schema?{responseSchema:schema}:{})}})});
 const d=await r.json().catch(()=>({}));
 if(!r.ok){const m=(d.error?.message||'')+' '+(d.error?.status||'');if(r.status==429||/quota|rate limit|RESOURCE_EXHAUSTED/i.test(m)){const er=Error('Se alcanzó el límite temporal de consultas a la IA. Por favor, intentá nuevamente en unos minutos.');er.quota=true;throw er}throw Error(d.error?.message||'Error de la IA')}
 const tx=(d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||'').join('').replace(/```json|```/g,'').trim();
 if(!tx)throw Error('La IA no devolvió respuesta ('+(d.promptFeedback?.blockReason||d.candidates?.[0]?.finishReason||'vacía')+')');
 try{return JSON.parse(tx)}catch{throw Error('Respuesta no válida de la IA: '+tx.slice(0,80))}}
const pick=(o,re)=>{const k=Object.keys(o||{}).find(k=>re.test(k.toLowerCase()));return k?num(o[k]):0},
fill=o=>{o=Array.isArray(o)?o[0]:o;const v={kcal:pick(o,/kcal|cal|energ/),prot:pick(o,/prot/),carb:pick(o,/carb|hidrat/),fat:pick(o,/fat|gras|lip/)};Object.keys(v).forEach(k=>$('#f_'+k).value=Math.round(v[k]*10)/10);const pp=$('#fpor');if(pp)pp.value=100;pv();return v},
SCH={type:'OBJECT',properties:{kcal:{type:'NUMBER'},prot:{type:'NUMBER'},carb:{type:'NUMBER'},fat:{type:'NUMBER'}},required:['kcal','prot','carb','fat']},
SCH2={type:'OBJECT',properties:{kcal:{type:'NUMBER'},prot:{type:'NUMBER'},carb:{type:'NUMBER'},fat:{type:'NUMBER'},net:{type:'NUMBER'},ingredients:{type:'STRING'},notes:{type:'STRING'}},required:['kcal','prot','carb','fat']},
READ='Sos un lector experto de empaques de alimentos argentinos. Las fotos son del mismo producto: la 1 es la tabla de información nutricional, la 2 los ingredientes y la 3 información adicional. Extraé en JSON: kcal, prot (proteínas), carb (carbohidratos totales) y fat (grasas totales), todo por 100 g o 100 ml. Si la tabla solo trae la columna por porción, convertí usando el peso de la porción; si solo hay kJ, dividí por 4,184. net: peso neto en gramos si figura. ingredients: los ingredientes en un texto corto. notes: modo de preparación, agua necesaria u otro dato útil. Leé solo lo que se ve; si un dato no aparece devolvé 0 o texto vacío y no inventes.',
NUT='Respondé SOLO JSON {"kcal":n,"prot":n,"carb":n,"fat":n} por 100 g (prot=proteínas, carb=carbohidratos, fat=grasas totales).';
async function lab(f){st('Leyendo etiqueta…');try{
 const im=await Promise.race([img(f),new Promise((_,x)=>setTimeout(()=>x(Error('No pude abrir la foto')),15000))]);
 const v=fill(await gem([{inlineData:{mimeType:'image/jpeg',data:im}},{text:'Es la tabla nutricional de un empaque. '+NUT+' Si está por porción, convertí con el peso de la porción.'}],SCH));
 st(v.kcal||v.prot||v.carb||v.fat?'Listo, revisá los valores':'La IA no encontró valores en la foto. Probá con otra más cerca y con buena luz')}catch(e){fail(e)}}
const col=()=>{cur={...cur,day:num($('#dd').value)||1,meal:$('#mm').value,cat:$('#mc').value,name:$('#mn').value,items:$$('.it').map(r=>({id:r.querySelector('select').value,g:num(r.querySelector('input').value)}))}};
function fF(f={}){cur=f;PH=[null,null,null];PX=[false,false,false];setTimeout(()=>{[0,1,2].forEach(phView);loadPh(f)});show(`<h3>${f.id?'Editar':'Nuevo'} alimento</h3>${fld('Nombre','fn',f.name)}<label>Tipo<select id="fk">${opt(KINDS,f.kind)}</select></label>${fld('Descripción (la IA la usa para estimar)','fd',f.desc)}<div class="r2">${fld('Peso neto (g)','fnet',f.net,'number')}${fld('Peso bruto con envase (g)','fgr',f.gross,'number')}</div><label>Información nutricional (completá con lo que dice la etiqueta)</label><div class="r4">${[['kcal','kcal'],['prot','Prot'],['carb','Carb'],['fat','Gras']].map(([k,l])=>fld(l,'f_'+k,f[k],'number')).join('')}</div>${fld('Los valores de arriba son por cuántos gramos (porción de la etiqueta)','fpor',100,'number')}<p id="pv" class="mu"></p><label>Fotos del producto (hasta 3)</label>${PT.map((t,i)=>`<div><button class="g ph" data-a="phT" data-i="${i}">${i+1}. ${t}<span id="pc${i}" class="mu"></span></button><div id="pb${i}" class="hid"></div><input type="file" id="pf${i}" accept="image/*" hidden><input type="file" id="pq${i}" accept="image/*" capture="environment" hidden></div>`).join('')}<div class="r2"><button data-a="read">Leer fotos con IA</button><button data-a="est">Estimar con IA</button></div><p id="st" class="mu"></p><button class="b" data-a="saveF">Guardar</button>${f.id?'<button class="dg" data-a="delF">Eliminar</button>':''}<button class="g" data-a="close">Cancelar</button>`)}
function fM(m){cur=m;const pn=S.pantry.length;show(`<h3>${m.id?'Editar':'Nueva'} comida</h3><div class="r2">${fld('Día','dd',m.day||1,'number')}<label>Comida<select id="mm">${opt(MEALS,m.meal)}</select></label></div><label>Categoría<select id="mc">${opt(CATS,m.cat)}</select></label>${fld('Nombre o notas','mn',m.name)}<label>Alimentos de la despensa (gramos)</label>${m.items.map((it,i)=>`<div class="row it"><select>${fl(it).map(f=>`<option value="${f.id}" ${f.id==it.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select><input type="number" inputmode="decimal" placeholder="g" value="${it.g||''}"><button data-a="delRow" data-i="${i}" aria-label="Quitar">✕</button></div>`).join('')}<button data-a="addRow">Agregar alimento</button><button class="b" data-a="saveM">Guardar</button>${m.id?'<button class="dg" data-a="delM">Eliminar</button>':''}<button class="g" data-a="close">Cancelar</button>`)}
const A={
tab:d=>{tab=d.k;pid=null;trip=false;R()},close:()=>{$('#ov').classList.add('hid');navSync()},
addF:()=>fF(),editF:d=>fF(S.pantry.find(f=>f.id==d.id)),scan:()=>$('#ph').click(),
saveF:()=>{const f={id:cur.id||uid(),name:$('#fn').value.trim(),kind:$('#fk').value,desc:$('#fd').value,net:num($('#fnet').value),gross:num($('#fgr').value)};const fc=100/(num($('#fpor').value)||100);['kcal','prot','carb','fat'].forEach(k=>f[k]=Math.round(num($('#f_'+k).value)*fc*10)/10);if(!f.name)return toast('Falta el nombre');f.ph=[0,1,2].map(i=>PX[i]?!!PH[i]:!!(cur.ph&&cur.ph[i]));[0,1,2].forEach(i=>PX[i]&&phWrite(f.id,i,PH[i]));const i=S.pantry.findIndex(x=>x.id==f.id);i<0?S.pantry.push(f):S.pantry[i]=f;save();A.close();R()},
delF:()=>{if(confirm('¿Eliminar este alimento?')){[0,1,2].forEach(i=>cur.ph&&cur.ph[i]&&phWrite(cur.id,i,null));S.pantry=S.pantry.filter(f=>f.id!=cur.id);save();A.close();R()}},
est:async()=>{const n=$('#fn').value.trim();if(!n)return toast('Poné un nombre');
 const ck='e:'+nk([n,$('#fk').value,$('#fd').value].join(' ')),hit=cget(ck);
 if(hit){fill(hit);return st('Valores tomados de la memoria de la app, sin consultar a la IA. Revisalos.')}
 st('Estimando…');try{const v=fill(await gem([{text:`Estimá la información nutricional de este alimento tal como se lleva en la mochila (sin preparar): "${n}" (tipo: ${$('#fk').value}). ${$('#fd').value}. ${NUT}`}],SCH));
 if(v.kcal||v.prot||v.carb||v.fat){cset(ck,v);st('Listo, revisá los valores')}else st('La IA no devolvió valores, probá de nuevo')}catch(e){fail(e)}},
newP:()=>{const n=prompt('Nombre del proyecto (ej. El Chaltén 2026)');if(n?.trim()){const p={id:uid(),name:n.trim(),menus:[],trip:[]};S.projects.push(p);save();pid=p.id;R()}},
openP:d=>{pid=d.id;trip=false;R()},back:()=>{if(trip)trip=false;else pid=null;R()},tgA:()=>{showA=!showA;R()},
pmenu:()=>show(`<h3>${esc(P().name)}</h3><button data-a="editP">Editar nombre</button><button data-a="archP">${P().arch?'Desarchivar':'Archivar'}</button><button class="dg" data-a="delP">Eliminar proyecto</button><button class="g" data-a="close">Cerrar</button>`),
editP:()=>{const p=P(),n=prompt('Nombre del proyecto',p.name);A.close();if(n?.trim()){p.name=n.trim();save();R()}},
archP:()=>{P().arch=!P().arch;save();A.close();pid=null;R()},
delP:()=>{if(confirm('¿Eliminar el proyecto y todos sus menús?')){S.projects=S.projects.filter(p=>p.id!=pid);save();A.close();pid=null;R()}},
addM:()=>fM({items:[]}),editM:d=>{const m=P().menus.find(x=>x.id==d.id);fM({...m,items:m.items.map(i=>({...i}))})},
addRow:()=>{col();const L=src(P());if(!L.length)return toast('Primero cargá alimentos en la Despensa');cur.items.push({id:L[0].id,g:0});fM(cur)},
delRow:d=>{col();cur.items.splice(+d.i,1);fM(cur)},
saveM:()=>{col();const p=P(),i=p.menus.findIndex(m=>m.id==cur.id);i<0?p.menus.push({...cur,id:uid()}):p.menus[i]=cur;save();A.close();R()},
delM:()=>{if(confirm('¿Eliminar esta comida?')){P().menus=P().menus.filter(m=>m.id!=cur.id);save();A.close();R()}},
gen:async()=>{ia={...ia,days:num($('#iad').value)||1,act:$('#iaa').value,clima:$('#iac').value,meals:$$('.chips input:checked').map(x=>x.value),p:$('#ip').value};
 if(!ia.meals.length)return toast('Elegí qué comidas armar');if(!S.pantry.length)return toast('Cargá alimentos en la Despensa');
 ia.busy=true;ia.res=null;R();
 try{const n=need(),p=S.profile,pj=S.projects.find(x=>x.id==ia.p),GL=pj?src(pj):S.pantry;
 const r=await gem([{text:`Sos nutricionista deportivo de montaña. Armá menús para un trekking.
Días: ${ia.days}. Actividades: ${ia.act||'trekking con mochila'}. Clima: ${ia.clima||'no indicado'}. Comidas a armar cada día: ${ia.meals.join(', ')}.
Persona: ${p.sex=='M'?'hombre':p.sex=='F'?'mujer':'sexo no indicado'}, ${age()||'?'} años, ${p.weight||'?'} kg, ${p.height||'?'} cm${n?`, requerimiento estimado ${n[1]} a ${n[2]} kcal/día`:''}.
Despensa (id|nombre|tipo|descripción|valores por 100 g|disponible):
${GL.map(f=>`${f.id}|${f.name}|${f.kind}|${f.desc||''}|${f.kcal} kcal P${f.prot} C${f.carb} G${f.fat}|${f.net} g`).join('\n')}
El tipo indica la preparación: los de consumo directo se comen sin cocinar; liofilizado, deshidratado y paquete para cocinar necesitan agua o cocción. Usá SOLO alimentos de la despensa con su id exacto y sin superar los gramos disponibles sumando todos los días. Priorizá calorías y carbohidratos, poco peso y preparación fácil en la montaña. Ajustá las kcal diarias al requerimiento.
Respondé SOLO un array JSON: [{"day":1,"meal":"${MEALS[0]}","cat":"${CATS[1]}","name":"descripción corta","items":[{"id":"...","g":50}]}]. meal ∈ ${MEALS.join('/')}; cat ∈ ${CATS.join('/')}.`}]);
 ia.res=(Array.isArray(r)?r:r.menus||[]).map(m=>({day:num(m.day)||1,meal:MEALS.includes(m.meal)?m.meal:'Almuerzo',cat:CATS.includes(m.cat)?m.cat:'Plato principal',name:m.name||'',items:(m.items||[]).filter(i=>GL.some(f=>f.id==i.id)).map(i=>({id:i.id,g:num(i.g)}))})).filter(m=>m.items.length);
 if(!ia.res.length)toast('La IA no devolvió menús válidos, probá de nuevo')}catch(e){toast(e.message)}
 ia.busy=false;R()},
saveIA:()=>{let p=S.projects.find(x=>x.id==ia.p);if(!p){const n=prompt('Nombre del nuevo proyecto (ej. El Chaltén 2026)');if(!n?.trim())return;p={id:uid(),name:n.trim(),menus:[],trip:[]};S.projects.push(p)}ia.res.forEach(m=>p.menus.push({...m,id:uid()}));save();ia.res=null;tab='menus';pid=p.id;R()},
exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({...S,set:{...S.set,key:''}})],{type:'application/json'}));a.download='nutri-ia-copia.json';a.click()},
login:async()=>{if(!db)return toast('El login con Google funciona en la versión web instalada, no en el APK');try{await firebase.auth().signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){toast(e.code=='auth/popup-blocked'?'Permití las ventanas emergentes':e.code=='auth/popup-closed-by-user'?'Inicio cancelado':e.message)}},
logout:async()=>{await firebase.auth().signOut();S.link=null;store()},
syncNow:()=>{toast('Sincronizando…');sync()},
phT:d=>{const e=$('#pb'+d.i);e.classList.toggle('hid')},
